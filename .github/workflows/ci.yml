name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile instahyre_apply.py refresh.py control.py publish.py edge_cdp.py
      - name: Help
        run: python instahyre_apply.py --help
      - name: Status
        run: python control.py status
